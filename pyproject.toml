[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dhan-engine"
version = "0.1.0"
description = "Institutional-grade trading runtime for Dhan market data and strategy orchestration."
requires-python = ">=3.10"
dependencies = [
  "dhanhq",
  "pandas",
  "python-dotenv",
  "requests",
  "websocket-client",
  "websockets",
]

[tool.setuptools.packages.find]
include = ["dhan_engine*"]
